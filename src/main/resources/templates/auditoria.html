<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="fw-bold mb-4">Auditoria</h2>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Ação</th>
                        <th>Registro</th>
                        <th>Detalhes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="6" class="text-center text-muted py-5">Nenhum registro encontrado.</td>
                    </tr>
                    <tr th:each="registro : ${registros}">
                        <td class="ps-4" th:text="${#dates.format(registro.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${registro.usuario}"></td>
                        <td th:text="${registro.perfil != null ? registro.perfil : 'Não registrado'}"></td>
                        <td th:text="${registro.acao}"></td>
                        <td th:text="${registro.tipo + ' #' + registro.registroId}"></td>
                        <td>
                            <div th:text="${registro.detalhes}"></div>
                            <details class="mt-2" th:if="${registro.alteracoes != null and !#lists.isEmpty(registro.alteracoes)}">
                                <summary>Ver campos alterados</summary>
                                <div class="table-responsive mt-2">
                                    <table class="table table-sm table-bordered mb-0">
                                        <thead>
                                            <tr>
                                                <th>Campo</th>
                                                <th>Valor anterior</th>
                                                <th>Novo valor</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="alteracao : ${registro.alteracoes}">
                                                <td th:text="${alteracao.campo}"></td>
                                                <td th:text="${alteracao.valorAnterior != null ? alteracao.valorAnterior : '(vazio)'}"></td>
                                                <td th:text="${alteracao.valorNovo != null ? alteracao.valorNovo : '(vazio)'}"></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </details>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
