<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h2 class="fw-bold mb-4">Editar Produto</h2>
    <div id="erroProduto" class="alert alert-danger" role="alert" hidden></div>
    <div class="card shadow-sm" style="max-width: 540px;">
        <div class="card-body p-4">
            <form id="editarProduto" th:action="@{/api/produtos/{id}(id=${produto.id})}"
                  th:object="${produto}" method="post">
                <label for="nome" class="form-label">Nome do Produto</label>
                <input id="nome" class="form-control mb-3" th:field="*{nome}" maxlength="100" required>
                <label for="tipo" class="form-label">Tipo do Produto</label>
                <input id="tipo" class="form-control mb-3" th:field="*{tipo}" maxlength="50" required>
                <label for="preco" class="form-label">Preço</label>
                <input id="preco" type="number" min="0" step="0.01" class="form-control mb-3" th:field="*{preco}" required>
                <div class="form-check mb-3">
                    <input id="ativo" type="checkbox" class="form-check-input" th:field="*{ativo}">
                    <label for="ativo" class="form-check-label">Produto Ativo</label>
                </div>
                <button class="btn btn-primary" type="submit">Salvar Alterações</button>
                <a class="btn btn-outline-secondary" href="/produtos">Cancelar</a>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('editarProduto').addEventListener('submit', async function (event) {
            event.preventDefault();
            const produto = {
                nome: document.getElementById('nome').value,
                tipo: document.getElementById('tipo').value,
                preco: Number(document.getElementById('preco').value),
                ativo: document.getElementById('ativo').checked
            };
            try {
                const resposta = await fetch(this.action, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', ...cabecalhosCsrf() },
                    body: JSON.stringify(produto)
                });
                if (!resposta.ok) throw new Error(await resposta.text() || 'Não foi possível salvar o produto.');
                window.location.href = '/produtos?salvo';
            } catch (erro) {
                const aviso = document.getElementById('erroProduto');
                aviso.textContent = erro.message;
                aviso.hidden = false;
            }
        });
    </script>
</div>
</body>
</html>
